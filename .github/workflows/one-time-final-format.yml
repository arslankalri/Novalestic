name: One-time final format and verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-final-format.yml

permissions:
  contents: write

jobs:
  final-format-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format repository
        run: bunx prettier --write .

      - name: Verify formatting
        run: bunx prettier --check .

      - name: Run tests
        run: bunx vitest run

      - name: Check TypeScript
        run: bunx tsc --noEmit

      - name: Run ESLint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit formatting and remove temporary workflow
        run: |
          git rm .github/workflows/one-time-final-format.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Format and verify final storefront updates"
            git push origin HEAD:main
          else
            echo "No additional formatting changes were needed."
          fi

      - name: Remove redundant fallback branch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "heads/lovable-fallback",
              });
              core.info("Deleted redundant lovable-fallback branch.");
            } catch (error) {
              if (error.status === 404) {
                core.info("lovable-fallback was already absent.");
              } else {
                throw error;
              }
            }

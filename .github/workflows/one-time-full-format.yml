name: One-time full formatting and verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-full-format.yml

permissions:
  contents: write

jobs:
  format-verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format all supported repository files
        run: bunx prettier --write .

      - name: Verify formatting
        run: bunx prettier --check .

      - name: Run tests
        run: bunx vitest run

      - name: Check TypeScript types
        run: bunx tsc --noEmit

      - name: Run ESLint after timer cleanup
        run: bun run lint

      - name: Build production bundle
        run: bun run build

      - name: Commit formatting and remove one-time workflow
        run: |
          git rm .github/workflows/one-time-full-format.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Format and verify Novalestic repository"
            git push origin HEAD:main
          else
            echo "No formatting changes were needed."
          fi

      - name: Delete redundant fallback branch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "heads/lovable-fallback",
              });
              core.info("Deleted lovable-fallback; it contained no commits ahead of main.");
            } catch (error) {
              if (error.status === 404) {
                core.info("lovable-fallback was already absent.");
              } else {
                throw error;
              }
            }

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, test, lint, type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format admin dashboard for review
        run: |
          bunx prettier --write src/novalestic/admin/AdminDashboard.tsx
          node -e "process.stdout.write('FORMATTED_FILE_BEGIN\\n' + Buffer.from(require('node:fs').readFileSync('src/novalestic/admin/AdminDashboard.tsx', 'utf8')).toString('base64') + '\\nFORMATTED_FILE_END\\n')"

      - name: Check formatting
        run: bunx prettier --check .

      - name: Run tests
        run: bunx vitest run

      - name: Check TypeScript
        run: bunx tsc --noEmit

      - name: Run ESLint
        run: bun run lint

      - name: Build
        run: bun run build

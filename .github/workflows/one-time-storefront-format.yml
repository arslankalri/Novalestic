name: One-time storefront formatting

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-storefront-format.yml

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format storefront and admin source
        run: |
          bunx prettier --write "src/novalestic/**/*.{ts,tsx,js,jsx,json,css,md}" "src/styles.css"

      - name: Verify formatting, tests, types, and production build
        run: |
          bunx prettier --check "src/novalestic/**/*.{ts,tsx,js,jsx,json,css,md}" "src/styles.css"
          bunx vitest run
          bunx tsc --noEmit
          bun run build

      - name: Commit formatting and remove this temporary workflow
        run: |
          git add src/novalestic src/styles.css
          if [ -f .github/workflows/one-time-storefront-format.yml ]; then
            git rm .github/workflows/one-time-storefront-format.yml
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Format Novalestic storefront and admin source"
            git push origin HEAD:main
          else
            echo "Formatting already committed; no additional changes."
          fi

      - name: Delete merged redesign branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              "work/apple-luxury-preview-20261019",
              "cleanup/remove-sample-content-20261019",
            ];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted ${branch}; it was identical to main before cleanup.`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`${branch} is already absent.`);
                } else {
                  throw error;
                }
              }
            }
